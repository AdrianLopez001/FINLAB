server.port=8081

# Database (defaults match docker-compose.yml; override with environment variables)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/finlab}
spring.datasource.username=${DB_USER:finlab}
spring.datasource.password=${DB_PASSWORD:finlab}

# Flyway creates and changes the tables; Hibernate only checks they match the code
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

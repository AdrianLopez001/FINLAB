services:
  postgres:
    image: postgres:16-alpine
    container_name: finlab-postgres
    environment:
      POSTGRES_DB: finlab
      POSTGRES_USER: finlab
      POSTGRES_PASSWORD: finlab
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finlab -d finlab"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
